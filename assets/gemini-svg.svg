<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Fondo oscuro estilo GitHub Dark Mode -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#010409" />
    </linearGradient>
    <!-- Brillo verde sutil detrás de la terminal -->
    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ea44f" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Renderizado del fondo -->
  <rect width="1000" height="300" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1" />
  <rect width="1000" height="300" rx="12" fill="url(#glow)" />
  
  <!-- LADO IZQUIERDO -->
  <!-- Etiqueta de estado (Status Pill) -->
  <rect x="60" y="50" width="220" height="32" rx="16" fill="#21262d" stroke="#30363d" stroke-width="1" />
  <circle cx="80" cy="66" r="5" fill="#2ea44f" />
  <text x="100" y="71" font-family="monospace" font-size="14" fill="#8b949e">open to projects • EC</text>
  
  <!-- Título principal -->
  <text x="60" y="160" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#ffffff">Hey, I'm Angel Rafael.</text>
  
  <!-- Subtítulo / Terminal prompt -->
  <text x="60" y="215" font-family="monospace" font-size="20" fill="#8b949e"><tspan fill="#2ea44f">~ ❯</tspan> data science & automatización</text>
  
  <!-- LADO DERECHO (Ventana de Terminal) -->
  <g transform="translate(660, 55)">
    <!-- Marco de la terminal -->
    <rect width="280" height="175" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    
    <!-- Botones estilo macOS -->
    <circle cx="20" cy="20" r="6" fill="#ff5f56" />
    <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
    <circle cx="60" cy="20" r="6" fill="#27c93f" />
    
    <!-- Título de la terminal -->
    <text x="195" y="24" font-family="monospace" font-size="12" fill="#8b949e">~/projects</text>
    
    <!-- Línea divisoria -->
    <line x1="0" y1="40" x2="280" y2="40" stroke="#30363d" stroke-width="1" />
    
    <!-- Lista de proyectos -->
    <circle cx="30" cy="70" r="4" fill="#2ea44f" />
    <text x="45" y="75" font-family="monospace" font-size="14" fill="#c9d1d9">communitly</text>
    
    <circle cx="30" cy="115" r="4" fill="#2ea44f" />
    <text x="45" y="120" font-family="monospace" font-size="14" fill="#c9d1d9">devio</text>
    
    <circle cx="30" cy="160" r="4" fill="#2ea44f" />
    <text x="45" y="165" font-family="monospace" font-size="14" fill="#c9d1d9">dispensador</text>
  </g>
  
  <!-- Enlace final -->
  <text x="790" y="270" font-family="monospace" font-size="13" fill="#6e7681">github.com/ZAngelCR</text>
</svg>